<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio-Juan Acevedo</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/6477cb770a.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav id="navbar">
           <div class="logo">Juan<span>Acevedo</span></div>
           <ul class="nav-links">
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#experiencia">Experiencia</a></li>
            <li><a href="#proyectos">Proyectos</a></li>
           </ul>
        </nav>
    </header>

    <main>
        <section id="inicio" class="hero">
            <div class="hero-content">

                    <h1>Juan Acevedo</h1>
                    <h2>Desarrollador java Junior Fullstack</h2>
                    <p>Apasionado por crear experiencias web unicas y funcionales. Siempre buscando aprender nuevas tecnologias y mejorar habilidades.</p>
                    <div class="social-links">
                        <a href="#" target="_blank"><i class="fab fa-github"></i></a>
                        <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
                        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
                    </div>
                    <a href="#contacto" class="btn">Contactame</a>
                </div>
                <div class="hero-image">
                    <img src="foto_portada .jpeg" alt="profile image">
                </div>
            </div>
        </section>
    </main>
    
</body>
</html>
